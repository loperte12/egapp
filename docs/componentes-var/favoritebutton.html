<div data-type="component-set" data-name="FavoriteButton" class="flex flex-col justify-start items-start gap-[var(规范尺寸/md)] p-[var(规范尺寸/lg)]">
  <div data-type="component" data-name="FavoriteButton-default" data-variant-state="default" class="flex flex-row justify-center items-center w-[36px] h-[36px] bg-[#000000]/[0.45] border-[1px] border-[#FFFFFF]/20 rounded-[999px]">
    <i data-name="corazon" class="far fa-heart text-[16px] text-[var(颜色/文本/反色)]"></i>
  </div>
  <div data-type="component" data-name="FavoriteButton-saved" data-variant-state="saved" class="flex flex-row justify-center items-center w-[36px] h-[36px] bg-[#000000]/[0.45] border-[1px] border-[#FFFFFF]/20 rounded-[999px]">
    <i data-name="corazon" class="fas fa-heart text-[16px] text-[var(颜色/文本/社交/喜欢)]"></i>
  </div>
  <div data-type="component" data-name="FavoriteButton-disabled" data-variant-state="disabled" class="flex flex-row justify-center items-center w-[36px] h-[36px] bg-[#000000]/[0.45] border-[1px] border-[#FFFFFF]/20 rounded-[999px]">
    <i data-name="corazon" class="far fa-heart text-[16px] text-[var(颜色/文本/次要)]"></i>
  </div>
</div>
