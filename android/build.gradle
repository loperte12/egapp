// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    // ESPEJOS DE ALIYUN — esta red no alcanza dl.google.com, repo.maven.apache.org
    // ni plugins.gradle.org (y github.com, al que redirige services.gradle.org, tampoco).
    // Se ponen DELANTE y se conservan los originales detrás por si algún día vuelven a estar
    // accesibles. Sin esto, `assembleRelease` no resuelve ni el plugin de Android.
    maven { url 'https://maven.aliyun.com/repository/google' }
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

def reactNativeAndroidDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim(),
  "../android"
)

allprojects {
  repositories {
    maven {
      // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
      url(reactNativeAndroidDir)
    }

    // Espejos de Aliyun primero (ver nota del buildscript de arriba).
    maven { url 'https://maven.aliyun.com/repository/google' }
    maven { url 'https://maven.aliyun.com/repository/public' }
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
