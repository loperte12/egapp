<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Alojamiento · Inicio</title>

  <!-- Tailwind CSS Play (runtime local, offline) -->
  <script src="./tailwind.js"></script>
  <!-- Lucide: única librería de iconos funcionales -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<!--
qb:map
app-shell -> 页面外壳（固定头、吸顶 Tabs、列表、底部栏、浮层）
main-content -> 入口、Banner 与双列瀑布流
app-overlays -> Toast 提示
-->

<body class="min-h-screen bg-[#1E1E23] text-[#F2F3F5] font-sans antialiased">

  <!-- qb:region:app-shell:start -->
  <div id="app" class="min-h-screen" data-qb-region="app-shell">

    <!-- 固定头：TopBar 56 + SearchBar 52 + StayBar 56 = 164px -->
    <header class="fixed inset-x-0 top-0 z-40">
      <!-- TopBar (56px) -->
      <div class="h-[56px] border-b border-[rgba(255,255,255,0.08)] bg-[#0F0F12] pt-[env(safe-area-inset-top)]">
        <div class="mx-auto flex h-[56px] max-w-[390px] items-center justify-between px-4">
          <div class="flex min-w-0 items-center gap-2.5">
            <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-[#0066CC]">
              <i data-lucide="building-2" class="h-5 w-5 text-white"></i>
            </span>
            <div class="min-w-0 leading-tight">
              <p class="truncate text-[16px] font-semibold text-[#F2F3F5]">Alojamiento</p>
              <button type="button" data-action="open-city" class="flex max-w-full items-center gap-1 text-[11px] text-[#9AA0A6] active:text-[#4D9FFF]">
                <i data-lucide="map-pin" class="h-3 w-3 shrink-0"></i>
                <span id="city-label" class="truncate">Malabo</span>
                <i data-lucide="chevron-down" class="h-3 w-3 shrink-0"></i>
              </button>
            </div>
          </div>
          <div class="flex shrink-0 items-center gap-2">
            <button type="button" data-action="bell" aria-label="Notificaciones"
              class="relative flex h-9 w-9 items-center justify-center rounded-full border border-[#2A2A30] bg-[#1E1E23] text-[#9AA0A6] active:bg-[#222228]">
              <i data-lucide="bell" class="h-[18px] w-[18px]"></i>
              <span class="absolute right-1.5 top-1.5 h-1.5 w-1.5 rounded-full bg-[#FF6B6B]"></span>
            </button>
            <a href="./index.html" class="text-[12px] font-medium text-[#4D9FFF] active:opacity-70">Kit ›</a>
          </div>
        </div>
      </div>

      <!-- SearchBar (52px) -->
      <div class="h-[52px] border-b border-[rgba(255,255,255,0.08)] bg-[#0F0F12]">
        <div class="mx-auto flex h-full max-w-[390px] items-center px-4">
          <div class="flex h-10 w-full items-center gap-2 rounded-lg border border-[#2A2A30] bg-[#111114] px-3 focus-within:border-[#4D9FFF]">
            <i data-lucide="search" class="h-4 w-4 shrink-0 text-[#9AA0A6]"></i>
            <input id="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="Busca alojamientos, barrios…"
              class="h-full w-full min-w-0 bg-transparent text-[14px] text-[#F2F3F5] placeholder:text-[#5A5F66] outline-none" />
            <button type="button" id="search-clear" data-action="clear-search" aria-label="Limpiar búsqueda"
              class="hidden h-6 w-6 shrink-0 items-center justify-center rounded-full bg-[#27272B] text-[#9AA0A6] active:bg-[#2A2A30]">
              <i data-lucide="x" class="h-3.5 w-3.5"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- StayBar (56px) -->
      <div class="h-[56px] border-b border-[rgba(255,255,255,0.08)] bg-[#0F0F12]">
        <div class="mx-auto flex h-full max-w-[390px] items-center gap-2 px-4">
          <span class="mr-1 text-[12px] font-semibold text-[#9AA0A6]">Estancia:</span>
          <button type="button" data-action="stay" data-stay="estadias"
            class="stay-chip h-8 rounded-full border border-[#4D9FFF] bg-[#14202F] px-3.5 text-[12px] font-medium text-[#4D9FFF] active:opacity-80">Estadías</button>
          <button type="button" data-action="stay" data-stay="horas"
            class="stay-chip h-8 rounded-full border border-[#2A2A30] bg-transparent px-3.5 text-[12px] font-medium text-[#9AA0A6] active:bg-[#222228]">Por horas</button>
          <button type="button" data-action="stay" data-stay="largas"
            class="stay-chip h-8 rounded-full border border-[#2A2A30] bg-transparent px-3.5 text-[12px] font-medium text-[#9AA0A6] active:bg-[#222228]">Largas estancias</button>
        </div>
      </div>
    </header>

    <!-- qb:section:main-content:start -->
    <main id="main-content" class="mx-auto max-w-[390px] px-4" data-qb-section="main-content">

      <!-- 吸顶 Tabs：正常文档流，sticky top:164px（固定在头部下方） -->
      <div class="sticky top-[164px] z-30 -mx-4 border-b border-[rgba(255,255,255,0.08)] bg-[#1E1E23] px-4">
        <div class="mx-auto flex max-w-[390px] gap-5 overflow-x-auto [scrollbar-width:none] [&::-webkit-scrollbar]:hidden" role="tablist" aria-label="Filtrar por precio">
          <button type="button" role="tab" data-action="tab" data-price="all"
            class="relative h-11 shrink-0 whitespace-nowrap text-[14px] font-medium text-[#F2F3F5]">Todos<span data-tab-line class="absolute inset-x-0 bottom-0 h-[2px] rounded-full bg-[#4D9FFF]"></span></button>
          <button type="button" role="tab" data-action="tab" data-price="low"
            class="relative h-11 shrink-0 whitespace-nowrap text-[14px] font-medium text-[#9AA0A6]">Hasta 30 000<span data-tab-line class="absolute inset-x-0 bottom-0 h-[2px] rounded-full bg-[#4D9FFF] hidden"></span></button>
          <button type="button" role="tab" data-action="tab" data-price="mid"
            class="relative h-11 shrink-0 whitespace-nowrap text-[14px] font-medium text-[#9AA0A6]">30 000–60 000<span data-tab-line class="absolute inset-x-0 bottom-0 h-[2px] rounded-full bg-[#4D9FFF] hidden"></span></button>
          <button type="button" role="tab" data-action="tab" data-price="high"
            class="relative h-11 shrink-0 whitespace-nowrap text-[14px] font-medium text-[#9AA0A6]">Más de 60 000<span data-tab-line class="absolute inset-x-0 bottom-0 h-[2px] rounded-full bg-[#4D9FFF] hidden"></span></button>
        </div>
      </div>

      <!-- 列表区：margin-top 208px（164 头 + 44 tabs），底部留白给固定底栏 -->
      <div id="feed" class="mt-[208px] pb-[calc(64px+env(safe-area-inset-bottom))]">

        <!-- Promo: ofertas por ciudad (?hidePromo=1 suprime este raíl) -->
        <div id="promo-rail" class="mt-1 -mx-4 flex gap-3 overflow-x-auto px-4 pb-1 snap-x [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"></div>

        <div class="flex items-baseline justify-between">
          <p id="feed-city" class="text-[14px] font-semibold text-[#F2F3F5]">En Malabo</p>
          <p id="result-count" class="text-[12px] font-medium text-[#4D9FFF]">12 alojamientos</p>
        </div>

        <!-- 2×4 入口：快速筛选（Barrios），每个按钮专属选中色 data-ac -->
        <div class="mt-3 grid grid-cols-4 gap-y-3">
          <button type="button" data-action="entry" data-b="Centro" data-ac="#4D9FFF" class="flex flex-col items-center gap-1 active:opacity-70">
            <span class="entry-ic flex h-10 w-10 items-center justify-center rounded-lg border border-[#2A2A30] bg-[#222228] text-[#9AA0A6]"><i data-lucide="landmark" class="h-5 w-5"></i></span>
            <span class="entry-lb w-full truncate text-center text-[12px] text-[#9AA0A6]">Centro</span>
            <span class="entry-ind h-[3px] w-6 rounded-full bg-transparent"></span>
          </button>
          <button type="button" data-action="entry" data-b="Playa" data-ac="#45B87A" class="flex flex-col items-center gap-1 active:opacity-70">
            <span class="entry-ic flex h-10 w-10 items-center justify-center rounded-lg border border-[#2A2A30] bg-[#222228] text-[#9AA0A6]"><i data-lucide="waves" class="h-5 w-5"></i></span>
            <span class="entry-lb w-full truncate text-center text-[12px] text-[#9AA0A6]">Playa</span>
            <span class="entry-ind h-[3px] w-6 rounded-full bg-transparent"></span>
          </button>
          <button type="button" data-action="entry" data-b="Aeropuerto" data-ac="#F08A4B" class="flex flex-col items-center gap-1 active:opacity-70">
            <span class="entry-ic flex h-10 w-10 items-center justify-center rounded-lg border border-[#2A2A30] bg-[#222228] text-[#9AA0A6]"><i data-lucide="plane" class="h-5 w-5"></i></span>
            <span class="entry-lb w-full truncate text-center text-[12px] text-[#9AA0A6]">Aeropuerto</span>
            <span class="entry-ind h-[3px] w-6 rounded-full bg-transparent"></span>
          </button>
          <button type="button" data-action="entry" data-b="Ureca" data-ac="#B08CFF" class="flex flex-col items-center gap-1 active:opacity-70">
            <span class="entry-ic flex h-10 w-10 items-center justify-center rounded-lg border border-[#2A2A30] bg-[#222228] text-[#9AA0A6]"><i data-lucide="umbrella" class="h-5 w-5"></i></span>
            <span class="entry-lb w-full truncate text-center text-[12px] text-[#9AA0A6]">Ureca</span>
            <span class="entry-ind h-[3px] w-6 rounded-full bg-transparent"></span>
          </button>
          <button type="button" data-action="entry" data-b="Punta Europa" data-ac="#F26DB6" class="flex flex-col items-center gap-1 active:opacity-70">
            <span class="entry-ic flex h-10 w-10 items-center justify-center rounded-lg border border-[#2A2A30] bg-[#222228] text-[#9AA0A6]"><i data-lucide="compass" class="h-5 w-5"></i></span>
            <span class="entry-lb w-full truncate text-center text-[12px] text-[#9AA0A6]">Punta Europa</span>
            <span class="entry-ind h-[3px] w-6 rounded-full bg-transparent"></span>
          </button>
          <button type="button" data-action="entry" data-b="Rebola" data-ac="#FFC94D" class="flex flex-col items-center gap-1 active:opacity-70">
            <span class="entry-ic flex h-10 w-10 items-center justify-center rounded-lg border border-[#2A2A30] bg-[#222228] text-[#9AA0A6]"><i data-lucide="tree-pine" class="h-5 w-5"></i></span>
            <span class="entry-lb w-full truncate text-center text-[12px] text-[#9AA0A6]">Rebola</span>
            <span class="entry-ind h-[3px] w-6 rounded-full bg-transparent"></span>
          </button>
          <button type="button" data-action="entry" data-b="Monte Alén" data-ac="#45C6C6" class="flex flex-col items-center gap-1 active:opacity-70">
            <span class="entry-ic flex h-10 w-10 items-center justify-center rounded-lg border border-[#2A2A30] bg-[#222228] text-[#9AA0A6]"><i data-lucide="mountain" class="h-5 w-5"></i></span>
            <span class="entry-lb w-full truncate text-center text-[12px] text-[#9AA0A6]">Monte Alén</span>
            <span class="entry-ind h-[3px] w-6 rounded-full bg-transparent"></span>
          </button>
          <button type="button" data-action="entry" data-b="Afueras" data-ac="#A5C4FF" class="flex flex-col items-center gap-1 active:opacity-70">
            <span class="entry-ic flex h-10 w-10 items-center justify-center rounded-lg border border-[#2A2A30] bg-[#222228] text-[#9AA0A6]"><i data-lucide="tent" class="h-5 w-5"></i></span>
            <span class="entry-lb w-full truncate text-center text-[12px] text-[#9AA0A6]">Afueras</span>
            <span class="entry-ind h-[3px] w-6 rounded-full bg-transparent"></span>
          </button>
        </div>

        <!-- Banner 3:1 -->
        <div class="mt-5 overflow-hidden rounded-xl border border-[rgba(255,255,255,0.08)]">
          <img src="https://ai-public.mastergo.com/ai/img_res/generated-a0ed5dbc-b07e-4893-963f-8ef808fc4cc5.jpg"
            alt="Vista aérea de la costa de Malabo" class="aspect-[3/1] w-full object-cover" loading="lazy" />
        </div>

        <!-- 双列瀑布流 -->
        <div class="mt-5 flex items-start gap-3">
          <div id="col-left" class="col-left min-w-0 flex-1 space-y-3">
            <!-- s1 -->
            <div class="skeleton-card overflow-hidden rounded-xl border border-[rgba(255,255,255,0.08)] bg-[#17171A]">
              <div class="w-full border-b border-[#2A2A30] bg-[#1E1E23] animate-pulse" style="height:220px"></div>
              <div class="space-y-2 p-2.5">
                <div class="h-2.5 w-4/5 rounded bg-[#2A2A30] animate-pulse"></div>
                <div class="h-2.5 w-3/5 rounded border border-[#2A2A30] bg-[#1E1E23] animate-pulse" style="animation-delay:150ms"></div>
                <div class="h-3.5 w-1/2 rounded bg-[#2A2A30] animate-pulse" style="animation-delay:300ms"></div>
              </div>
            </div>
            <!-- s2 -->
            <div class="skeleton-card overflow-hidden rounded-xl border border-[rgba(255,255,255,0.08)] bg-[#17171A]">
              <div class="w-full border-b border-[#2A2A30] bg-[#1E1E23] animate-pulse" style="height:260px;animation-delay:100ms"></div>
              <div class="space-y-2 p-2.5">
                <div class="h-2.5 w-3/4 rounded bg-[#2A2A30] animate-pulse" style="animation-delay:150ms"></div>
                <div class="h-2.5 w-2/3 rounded border border-[#2A2A30] bg-[#1E1E23] animate-pulse" style="animation-delay:300ms"></div>
                <div class="h-3.5 w-2/5 rounded bg-[#2A2A30] animate-pulse" style="animation-delay:450ms"></div>
              </div>
            </div>
            <!-- s3 -->
            <div class="skeleton-card overflow-hidden rounded-xl border border-[rgba(255,255,255,0.08)] bg-[#17171A]">
              <div class="w-full border-b border-[#2A2A30] bg-[#1E1E23] animate-pulse" style="height:190px;animation-delay:200ms"></div>
              <div class="space-y-2 p-2.5">
                <div class="h-2.5 w-4/5 rounded bg-[#2A2A30] animate-pulse" style="animation-delay:250ms"></div>
                <div class="h-2.5 w-1/2 rounded border border-[#2A2A30] bg-[#1E1E23] animate-pulse" style="animation-delay:400ms"></div>
                <div class="h-3.5 w-3/5 rounded bg-[#2A2A30] animate-pulse" style="animation-delay:550ms"></div>
              </div>
            </div>
            <!-- s4 -->
            <div class="skeleton-card overflow-hidden rounded-xl border border-[rgba(255,255,255,0.08)] bg-[#17171A]">
              <div class="w-full border-b border-[#2A2A30] bg-[#1E1E23] animate-pulse" style="height:240px;animation-delay:300ms"></div>
              <div class="space-y-2 p-2.5">
                <div class="h-2.5 w-3/4 rounded bg-[#2A2A30] animate-pulse" style="animation-delay:350ms"></div>
                <div class="h-2.5 w-2/3 rounded border border-[#2A2A30] bg-[#1E1E23] animate-pulse" style="animation-delay:500ms"></div>
                <div class="h-3.5 w-1/3 rounded bg-[#2A2A30] animate-pulse" style="animation-delay:650ms"></div>
              </div>
            </div>
          </div>
          <div id="col-right" class="col-right min-w-0 flex-1 space-y-3">
            <!-- s5 -->
            <div class="skeleton-card overflow-hidden rounded-xl border border-[rgba(255,255,255,0.08)] bg-[#17171A]">
              <div class="w-full border-b border-[#2A2A30] bg-[#1E1E23] animate-pulse" style="height:200px;animation-delay:100ms"></div>
              <div class="space-y-2 p-2.5">
                <div class="h-2.5 w-4/5 rounded bg-[#2A2A30] animate-pulse" style="animation-delay:150ms"></div>
                <div class="h-2.5 w-1/2 rounded border border-[#2A2A30] bg-[#1E1E23] animate-pulse" style="animation-delay:300ms"></div>
                <div class="h-3.5 w-3/5 rounded bg-[#2A2A30] animate-pulse" style="animation-delay:450ms"></div>
              </div>
            </div>
            <!-- s6 -->
            <div class="skeleton-card overflow-hidden rounded-xl border border-[rgba(255,255,255,0.08)] bg-[#17171A]">
              <div class="w-full border-b border-[#2A2A30] bg-[#1E1E23] animate-pulse" style="height:250px;animation-delay:200ms"></div>
              <div class="space-y-2 p-2.5">
                <div class="h-2.5 w-3/4 rounded bg-[#2A2A30] animate-pulse" style="animation-delay:250ms"></div>
                <div class="h-2.5 w-2/3 rounded border border-[#2A2A30] bg-[#1E1E23] animate-pulse" style="animation-delay:400ms"></div>
                <div class="h-3.5 w-2/5 rounded bg-[#2A2A30] animate-pulse" style="animation-delay:550ms"></div>
              </div>
            </div>
            <!-- s7 -->
            <div class="skeleton-card overflow-hidden rounded-xl border border-[rgba(255,255,255,0.08)] bg-[#17171A]">
              <div class="w-full border-b border-[#2A2A30] bg-[#1E1E23] animate-pulse" style="height:180px;animation-delay:300ms"></div>
              <div class="space-y-2 p-2.5">
                <div class="h-2.5 w-4/5 rounded bg-[#2A2A30] animate-pulse" style="animation-delay:350ms"></div>
                <div class="h-2.5 w-1/2 rounded border border-[#2A2A30] bg-[#1E1E23] animate-pulse" style="animation-delay:500ms"></div>
                <div class="h-3.5 w-3/5 rounded bg-[#2A2A30] animate-pulse" style="animation-delay:650ms"></div>
              </div>
            </div>
            <!-- s8 -->
            <div class="skeleton-card overflow-hidden rounded-xl border border-[rgba(255,255,255,0.08)] bg-[#17171A]">
              <div class="w-full border-b border-[#2A2A30] bg-[#1E1E23] animate-pulse" style="height:230px;animation-delay:400ms"></div>
              <div class="space-y-2 p-2.5">
                <div class="h-2.5 w-3/4 rounded bg-[#2A2A30] animate-pulse" style="animation-delay:450ms"></div>
                <div class="h-2.5 w-2/3 rounded border border-[#2A2A30] bg-[#1E1E23] animate-pulse" style="animation-delay:600ms"></div>
                <div class="h-3.5 w-1/3 rounded bg-[#2A2A30] animate-pulse" style="animation-delay:750ms"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Estado vacío -->
        <div id="empty-state" class="hidden mt-6 flex flex-col items-center rounded-xl border border-[#2A2A30] bg-[#17171A] px-6 py-10 text-center">
          <span class="flex h-14 w-14 items-center justify-center rounded-full bg-[#27272B] text-[#9AA0A6]"><i data-lucide="search-x" class="h-7 w-7"></i></span>
          <h3 class="mt-4 text-[16px] font-semibold text-[#F2F3F5]">Sin resultados</h3>
          <p class="mt-1.5 max-w-[260px] text-[13px] leading-relaxed text-[#9AA0A6]">No hay alojamientos con estos filtros en Malabo. Prueba con otras opciones.</p>
          <button type="button" data-action="reset-filters" class="mt-5 h-11 rounded-lg bg-[#0066CC] px-6 text-[14px] font-medium text-white active:bg-[#0052A3]">Limpiar filtros</button>
        </div>

      </div>
    </main>
    <!-- qb:section:main-content:end -->

    <!-- qb:section:app-overlays:start -->
    <div id="app-overlays" class="pointer-events-none fixed inset-0 z-50" data-qb-section="app-overlays" aria-live="polite">
      <div id="toast" role="status"
        class="pointer-events-auto fixed left-1/2 top-[calc(env(safe-area-inset-top)+76px)] z-[60] flex -translate-x-1/2 translate-y-[-8px] items-center gap-2 rounded-lg border bg-[#0F0F12] px-4 py-3 opacity-0 transition-all duration-300">
        <i id="toast-icon" data-lucide="info" class="h-4 w-4 shrink-0 text-[#4D9FFF]"></i>
        <span id="toast-text" class="text-[13px] font-medium text-[#F2F3F5]"></span>
      </div>
    </div>
    <!-- qb:section:app-overlays:end -->

    <!-- qb:region:city-sheet:start -->
    <div id="city-scrim" class="fixed inset-0 z-[55] hidden bg-[#000000]/60" data-action="close-city"></div>
    <div id="city-sheet" class="fixed inset-x-0 bottom-0 z-[60] mx-auto hidden max-w-[390px] rounded-t-[16px] border-t border-[rgba(255,255,255,0.08)] bg-[#0F0F12] px-4 pb-[calc(16px+env(safe-area-inset-bottom))] pt-2" data-qb-region="city-sheet">
      <div class="flex items-center justify-between border-b border-[rgba(255,255,255,0.08)] pb-3">
        <p class="text-[15px] font-semibold text-[#F2F3F5]">Elegir ciudad</p>
        <button type="button" data-action="close-city" aria-label="Cerrar"
          class="flex h-8 w-8 items-center justify-center rounded-full bg-[#27272B] text-[#9AA0A6] active:bg-[#2A2A30]"><i data-lucide="x" class="h-4 w-4"></i></button>
      </div>
      <div id="city-list" class="py-1"></div>
    </div>
    <!-- qb:region:city-sheet:end -->

    <!-- 底部固定栏 (64px + safe-area) -->
    <nav aria-label="Navegación principal"
      class="fixed inset-x-0 bottom-0 z-40 h-[calc(64px+env(safe-area-inset-bottom))] border-t border-[rgba(255,255,255,0.08)] bg-[#0F0F12] pb-[env(safe-area-inset-bottom)]">
      <div class="mx-auto flex h-[64px] max-w-[390px] items-stretch">
        <button type="button" data-action="nav" data-nav="inicio" aria-label="Inicio"
          class="nav-item flex flex-1 flex-col items-center justify-center gap-1 text-[#4D9FFF] active:opacity-70">
          <i data-lucide="home" class="h-[22px] w-[22px]"></i>
          <span class="text-[10px] font-semibold">Inicio</span>
        </button>
        <button type="button" data-action="nav" data-nav="buscar" aria-label="Buscar"
          class="nav-item flex flex-1 flex-col items-center justify-center gap-1 text-[#9AA0A6] active:opacity-70">
          <i data-lucide="search" class="h-[22px] w-[22px]"></i>
          <span class="text-[10px] font-medium">Buscar</span>
        </button>
        <button type="button" data-action="nav" data-nav="favs" aria-label="Favoritos"
          class="nav-item relative flex flex-1 flex-col items-center justify-center gap-1 text-[#9AA0A6] active:opacity-70">
          <span class="relative flex items-center justify-center">

  <script>
    (function () {
      var app = document.getElementById('app');
      if (!app) return;

      // Datos de prueba (textos y precios fijos, sin modificar)
      var CARDS = [
        { n: "Hotel Bahía de Malabo", b: "Centro", p: 45000, t: 60000, r: 4.8, v: 128, badge: "Foto real", tag: "Cancelación gratuita", ratio: "3:4", c: "Malabo" },
        { n: "Punta Europa Suites", b: "Punta Europa", p: 72000, t: null, r: 4.9, v: 84, badge: "Superanfitrión", tag: "Desayuno incluido", ratio: "4:3", c: "Malabo" },
        { n: "Casa Colonial Malabo", b: "Hipódromo", p: 30000, t: 38000, r: 4.6, v: 201, badge: "Casa completa", tag: "Cancelación gratuita", ratio: "1:1", c: "Malabo" },
        { n: "Hotel Aeropuerto Santa Isabel", b: "Aeropuerto", p: 27000, t: null, r: 4.3, v: 56, badge: null, tag: "Confirmación inmediata", ratio: "3:4", c: "Bata" },
        { n: "Villa Monte Alén", b: "Afueras", p: 55000, t: 70000, r: 4.7, v: 93, badge: "Por horas·3h", tag: null, ratio: "4:3", c: "Luba" },
        { n: "Apartamento Vista Mar", b: "Playa", p: 40000, t: null, r: 4.5, v: 167, badge: "Foto real", tag: "Cancelación gratuita", ratio: "1:1", c: "Malabo" },
        { n: "Hotel Ureca Beach", b: "Ureca", p: 63000, t: null, r: 4.9, v: 41, badge: null, tag: "Desayuno incluido", ratio: "3:4", c: "Malabo" },
        { n: "Residencia Sala Wele-Nzas", b: "Sala Wele-Nzas", p: 18000, t: 24000, r: 4.1, v: 312, badge: null, tag: null, ratio: "4:3", c: "Bata" },
        { n: "Spa & Resort Malabo", b: "Centro", p: 90000, t: 110000, r: 4.8, v: 74, badge: "Lujo", tag: "Cancelación gratuita", ratio: "3:4", c: "Malabo" },
        { n: "Hostal El Jardín", b: "Rebola", p: 15000, t: null, r: 4.4, v: 189, badge: null, tag: "Confirmación inmediata", ratio: "1:1", c: "Mongomo" },
        { n: "Bungalow Selva Verde", b: "Monte Alén", p: 48000, t: null, r: 4.7, v: 62, badge: "Casa completa", tag: "Desayuno incluido", ratio: "3:4", c: "Ebebiyín" },
        { n: "Torre Bahía Business", b: "Centro", p: 52000, t: 65000, r: 4.6, v: 145, badge: null, tag: "Cancelación gratuita", ratio: "4:3", c: "Malabo" }
      ];
      // 一对一使用位置：IMAGES[i] 对应 CARDS[i]
      var IMAGES = [
        "https://ai-public.mastergo.com/ai/img_res/generated-45d71696-6087-413c-9b05-20f4c0b5af09.jpg",
        "https://ai-public.mastergo.com/ai/img_res/generated-989e6e76-b12e-468e-a6ee-5efd294b0e91.jpg",
        "https://ai-public.mastergo.com/ai/img_res/generated-571dd495-20d7-4b3e-ab58-ffdea853ae48.jpg",
        "https://ai-public.mastergo.com/ai/img_res/generated-f603cb4f-b874-4651-9a13-1da614971e0f.jpg",
        "https://ai-public.mastergo.com/ai/img_res/generated-24d472a9-3473-47fa-8818-aaf06d34bcdb.jpg",
        "https://ai-public.mastergo.com/ai/img_res/generated-c4813123-69e7-40af-bff3-3d8df185f00f.jpg",
        "https://ai-public.mastergo.com/ai/img_res/generated-6b848a71-cda2-4871-a839-e52f5b81049c.jpg",
        "https://ai-public.mastergo.com/ai/img_res/generated-51a16d38-c943-496f-8807-b88b87ffdcfc.jpg",
        "https://ai-public.mastergo.com/ai/img_res/generated-b1a87f42-259e-4739-9b91-066cfc6823f1.jpg",
        "https://ai-public.mastergo.com/ai/img_res/generated-118db9c6-9570-46a4-afd1-12cfe4bf53ad.jpg",
        "https://ai-public.mastergo.com/ai/img_res/generated-be5a6a58-232c-4393-9288-4c334a5b9a28.jpg",
        "https://ai-public.mastergo.com/ai/img_res/generated-866a484a-f6f3-49c2-9331-2a5b50b01eb2.jpg"
      ];
      var RATIO = { "3:4": "3 / 4", "4:3": "4 / 3", "1:1": "1 / 1" };

      // Ciudades: selector con persistencia aloja_city (por defecto Malabo)
      var CITIES = ['Malabo', 'Bata', 'Mongomo', 'Ebebiyín', 'Luba'];
      var HIDE_PROMO = false;
      try { HIDE_PROMO = new URLSearchParams(window.location.search).get('hidePromo') === '1'; } catch (e) {}
      function readCity() {
        try { return localStorage.getItem('aloja_city') || 'Malabo'; } catch (e) { return 'Malabo'; }
      }
      function readFavs() {
        var o = {};
        try {
          var a = JSON.parse(localStorage.getItem('aloja_favs') || '[]');
          if (a && a.forEach) a.forEach(function (i) { if (typeof i === 'number') o[i] = true; });
        } catch (e) {}
        return o;
      }
      function saveFavs() {
        var a = [];
        Object.keys(state.favs).forEach(function (k) { if (state.favs[k]) a.push(parseInt(k, 10)); });
        try { localStorage.setItem('aloja_favs', JSON.stringify(a)); } catch (e) {}
      }
      function pv(tag, cls, txt) {
        var e = document.createElement(tag);
        e.className = cls;
        e.textContent = txt || '';
        return e;
      }
      var state = { price: 'all', barrios: {}, query: '', stay: 'estadias', favs: readFavs(), city: readCity() };
      // Banner promocional: ofertas por ciudad (precios en XAF, se formatean con fmtXAF)
      var BANNERS = [
        { img: IMAGES[8], o: 110000, p: 90000, city: 'Malabo' },
        { img: IMAGES[3], o: 36000, p: 27000, city: 'Bata' },
        { img: IMAGES[10], o: 62000, p: 48000, city: 'Mongomo' }
      ];

      function icons() {
        if (window.lucide && lucide.createIcons) { try { lucide.createIcons(); } catch (e) {} }
      }
      function norm(s) {
        return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      }
      // fmtXAF: misma implementación en home.html y saved.html (DUPLICADO CONTROLADO)
      function fmtXAF(p) {
        var rates = { XAF: 1, EUR: 1 / 655, USD: 1 / 600 };
        var c = 'XAF';
        try { c = localStorage.getItem('currency') || 'XAF'; } catch (e) {}
        var r = rates[c] || 1;
        return c + ' ' + Math.round(p * r).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
      }
      window.addEventListener('storage', function () {
        try { renderFeed(); } catch (e) {}
        try { renderPromo(); } catch (e) {}
        try { updateFavBadge(); } catch (e) {}
      });

      function buildCard(i) {
        var c = CARDS[i];
        var card = document.createElement('article');
        card.className = 'overflow-hidden rounded-xl border border-[rgba(255,255,255,0.08)] bg-[#17171A]';
        card.setAttribute('data-card', '');
        card.setAttribute('data-idx', String(i));

        var wrap = document.createElement('div');
        wrap.className = 'relative w-full';
        wrap.style.aspectRatio = RATIO[c.ratio];

        if (IMAGES[i]) {
          var img = document.createElement('img');
          img.src = IMAGES[i];
          img.alt = c.n;
          img.loading = 'lazy';
          img.className = 'h-full w-full object-cover';
          wrap.appendChild(img);
        } else {
          var ph = document.createElement('div');
          ph.className = 'flex h-full w-full items-center justify-center bg-[#222228] text-[#5A5F66]';
          var phi = document.createElement('i');
          phi.setAttribute('data-lucide', 'building-2');
          phi.className = 'h-8 w-8';
          ph.appendChild(phi);
          wrap.appendChild(ph);
        }

        if (c.badge) {
          var badge = document.createElement('span');
          badge.className = 'absolute left-2 top-2 rounded-md bg-[#0F0F12]/90 px-2 py-1 text-[10px] font-semibold text-[#F2F3F5]';
          badge.textContent = c.badge;
          wrap.appendChild(badge);
        }

        var faved = state.favs[i] === true;
        var favBtn = document.createElement('button');
        favBtn.type = 'button';
        favBtn.setAttribute('data-action', 'fav');
        favBtn.setAttribute('data-idx', String(i));
        favBtn.setAttribute('aria-label', 'Favorito');
        favBtn.className = 'absolute right-2 top-2 flex h-8 w-8 items-center justify-center rounded-full bg-[#0F0F12]/90 active:scale-95 ' + (faved ? 'text-[#F08A4B]' : 'text-[#F2F3F5]');
        var heart = document.createElement('i');
        heart.setAttribute('data-lucide', 'heart');
        heart.className = 'h-4 w-4' + (faved ? ' fill-[#F08A4B]' : '');
        favBtn.appendChild(heart);
        wrap.appendChild(favBtn);
        card.appendChild(wrap);

        var body = document.createElement('div');
        body.className = 'p-2.5';

        var title = document.createElement('h3');
        title.className = 'line-clamp-2 text-[13px] font-medium leading-snug text-[#F2F3F5]';
        title.textContent = c.n;
        body.appendChild(title);

        var meta = document.createElement('div');
        meta.className = 'mt-1 flex items-center gap-1 text-[12px]';
        var star = document.createElement('i');
        star.setAttribute('data-lucide', 'star');
        star.className = 'h-3 w-3 fill-[#F2F3F5] text-[#F2F3F5]';
        meta.appendChild(star);
        var rate = document.createElement('span');
        rate.className = 'font-semibold text-[#F2F3F5]';
        rate.textContent = c.r.toFixed(1);
        meta.appendChild(rate);
        var votes = document.createElement('span');
        votes.className = 'text-[#9AA0A6]';
        votes.textContent = '(' + c.v + ')';
        meta.appendChild(votes);
        var barrio = document.createElement('span');
        barrio.className = 'ml-1 truncate text-[11px] text-[#9AA0A6]';
        barrio.textContent = '· ' + c.b;
        meta.appendChild(barrio);
        body.appendChild(meta);

        var priceRow = document.createElement('div');
        priceRow.className = 'mt-1.5 flex flex-wrap items-baseline gap-x-1.5 gap-y-0.5';
        var p1 = document.createElement('span');
        p1.className = 'text-[14px] font-bold text-[#F08A4B]';
        p1.textContent = fmtXAF(c.p);
        priceRow.appendChild(p1);
        if (c.t) {
          var p2 = document.createElement('span');
          p2.className = 'text-[11px] text-[#5A5F66] line-through';
          p2.textContent = fmtXAF(c.t);
          priceRow.appendChild(p2);
        }
        body.appendChild(priceRow);

        if (c.tag) {
          var tag = document.createElement('span');
          tag.className = 'mt-1.5 inline-block rounded-md bg-[#1D2A26] px-1.5 py-0.5 text-[10px] font-medium text-[#45B87A]';
          tag.textContent = c.tag;
          body.appendChild(tag);
        }

        card.appendChild(body);
        return card;
      }

      function match(i) {
        var c = CARDS[i];
        var okPrice = state.price === 'all' ||
          (state.price === 'low' && c.p <= 30000) ||
          (state.price === 'mid' && c.p > 30000 && c.p <= 60000) ||
          (state.price === 'high' && c.p > 60000);
        var bKeys = Object.keys(state.barrios);
        var okBarrio = bKeys.length === 0 || !!state.barrios[c.b];
        var q = norm(state.query);
        var okQuery = !q || norm(c.n).includes(q) || norm(c.b).includes(q);
        var okStay = state.stay !== 'horas' || c.badge === 'Por horas·3h';
        var okCity = c.c === state.city;
        return okPrice && okBarrio && okQuery && okStay && okCity;
      }

      function renderFeed() {
        var left = document.getElementById('col-left');
        var right = document.getElementById('col-right');
        if (!left || !right) return;
        left.textContent = '';
        right.textContent = '';
        var visible = 0;
        CARDS.forEach(function (c, i) {
          if (!match(i)) return;
          (i % 2 === 0 ? left : right).appendChild(buildCard(i));
          visible++;
        });
        icons();
        var count = document.getElementById('result-count');
        if (count) count.textContent = visible + (visible === 1 ? ' alojamiento' : ' alojamientos');
        var empty = document.getElementById('empty-state');
        if (empty) empty.classList.toggle('hidden', visible !== 0);
      }

      function renderTabs() {
        document.querySelectorAll('[data-action="tab"]').forEach(function (t) {
          var active = t.getAttribute('data-price') === state.price;
          t.classList.toggle('text-[#F2F3F5]', active);
          t.classList.toggle('text-[#9AA0A6]', !active);
          var line = t.querySelector('[data-tab-line]');
          if (line) line.classList.toggle('hidden', !active);
        });
      }

      function renderEntries() {
        document.querySelectorAll('[data-action="entry"]').forEach(function (b) {
          var on = !!state.barrios[b.getAttribute('data-b')];
          var ac = b.getAttribute('data-ac') || '#4D9FFF';
          var ic = b.querySelector('.entry-ic');
          var lb = b.querySelector('.entry-lb');
          var ind = b.querySelector('.entry-ind');
          if (ic) {
            ic.style.borderColor = on ? ac : '';
            ic.style.color = on ? ac : '';
            ic.style.backgroundColor = on ? ac + '26' : '';
          }
          if (lb) {
            lb.classList.toggle('text-[#F2F3F5]', on);
            lb.classList.toggle('text-[#9AA0A6]', !on);
          }
          if (ind) ind.style.backgroundColor = on ? ac : 'transparent';
        });
      }

      function renderStay() {
        document.querySelectorAll('[data-action="stay"]').forEach(function (b) {
          var on = b.getAttribute('data-stay') === state.stay;
          b.classList.toggle('border-[#4D9FFF]', on);
          b.classList.toggle('bg-[#14202F]', on);
          b.classList.toggle('text-[#4D9FFF]', on);
          b.classList.toggle('border-[#2A2A30]', !on);
          b.classList.toggle('bg-transparent', !on);
          b.classList.toggle('text-[#9AA0A6]', !on);
        });
      }

      // —— Toast ——
      var toastTimer = null;
      function showToast(msg, type) {
        var toast = document.getElementById('toast');
        var icon = document.getElementById('toast-icon');
        var text = document.getElementById('toast-text');
        if (!toast || !icon || !text) return;
        var palette = {
          info: { icon: 'info', color: 'text-[#4D9FFF]', border: 'border-[#4D9FFF]' },
          success: { icon: 'check-circle', color: 'text-[#45B87A]', border: 'border-[#45B87A]' },
          danger: { icon: 'alert-circle', color: 'text-[#FF6B6B]', border: 'border-[#FF6B6B]' }
        };
        var p = palette[type] || palette.info;
        icon.dataset.lucide = p.icon;
        icon.className = 'h-4 w-4 shrink-0 ' + p.color;
        toast.className = 'pointer-events-auto fixed left-1/2 top-[calc(env(safe-area-inset-top)+76px)] z-[60] flex -translate-x-1/2 items-center gap-2 rounded-lg border bg-[#0F0F12] px-4 py-3 opacity-100 translate-y-0 transition-all duration-300 ' + p.border;
        text.textContent = msg;
        icons();
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.add('opacity-0', 'translate-y-[-8px]');
        }, 2400);
      }

      // —— búsqueda en vivo ——
      var searchInput = document.getElementById('search-input');
      if (searchInput) {
        searchInput.addEventListener('input', function () {
          state.query = searchInput.value.trim();
          var clear = document.getElementById('search-clear');
          if (clear) {
            clear.classList.toggle('hidden', !state.query);
            clear.classList.toggle('flex', Boolean(state.query));
          }
          renderFeed();
        });
      }

      // —— delegación de clics (data-action) ——
      app.addEventListener('click', function (event) {
        var t = event.target.closest('[data-action]');
        if (!t) return;
        var action = t.getAttribute('data-action');

        if (action === 'tab') {
          state.price = t.getAttribute('data-price');
          renderTabs();
          renderFeed();
        }

        else if (action === 'entry') {
          var b = t.getAttribute('data-b');
          state.barrios[b] = !state.barrios[b];
          if (!state.barrios[b]) delete state.barrios[b];
          renderEntries();
          renderFeed();
        }

        else if (action === 'stay') {
          state.stay = t.getAttribute('data-stay');
          renderStay();
          renderFeed();
          if (state.stay === 'horas') showToast('Filtro: por horas', 'info');
        }

        else if (action === 'fav') {
          var idx = t.getAttribute('data-idx');
          state.favs[idx] = !state.favs[idx];
          var on = state.favs[idx];
          t.classList.toggle('text-[#F08A4B]', on);
          t.classList.toggle('text-[#F2F3F5]', !on);
          var svg = t.querySelector('svg');
          if (svg) svg.classList.toggle('fill-[#F08A4B]', on);
          saveFavs();
          updateFavBadge();
          showToast(on ? 'Añadido a favoritos' : 'Eliminado de favoritos', on ? 'success' : 'info');
        }

        else if (action === 'clear-search') {
          if (searchInput) { searchInput.value = ''; state.query = ''; }
          var clear = document.getElementById('search-clear');
          if (clear) { clear.classList.add('hidden'); clear.classList.remove('flex'); }
          renderFeed();
          searchInput && searchInput.focus();
        }

        else if (action === 'reset-filters') {
          state.price = 'all'; state.barrios = {}; state.query = ''; state.stay = 'estadias';
          if (searchInput) searchInput.value = '';
          var clear = document.getElementById('search-clear');
          if (clear) { clear.classList.add('hidden'); clear.classList.remove('flex'); }
          renderTabs(); renderEntries(); renderStay(); renderFeed();
          showToast('Filtros restablecidos', 'success');
        }

        else if (action === 'nav') {
          var nav = t.getAttribute('data-nav');
          document.querySelectorAll('[data-action="nav"]').forEach(function (b) {
            var active = b === t;
            b.classList.toggle('text-[#4D9FFF]', active);
            b.classList.toggle('text-[#9AA0A6]', !active);
            var lbl = b.querySelector('span');
            if (lbl) lbl.classList.toggle('font-semibold', active);
          });
          if (nav === 'buscar' && searchInput) {
            searchInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
            setTimeout(function () { searchInput.focus(); }, 250);
          } else if (nav === 'inicio') {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else if (nav === 'reservas') {
            showToast('Aún no tienes reservas', 'danger');
          } else if (nav === 'perfil') {
            showToast('Perfil de huésped', 'info');
          } else if (nav === 'favs') {
            try { window.location.assign('./saved.html'); } catch (e) {}
          } else if (nav === 'mensajes') {
            try { window.location.assign('./messages.html'); } catch (e) {}
          }
        }

        else if (action === 'open-city') {
          openCitySheet();
        }

        else if (action === 'close-city') {
          closeCitySheet();
        }

        else if (action === 'pick-city') {
          var c3 = t.getAttribute('data-city');
          if (!c3 || c3 === state.city) { closeCitySheet(); return; }
          state.city = c3;
          try { localStorage.setItem('aloja_city', c3); } catch (e) {}
          closeCitySheet();
          var cl2 = document.getElementById('city-label');
          if (cl2) cl2.textContent = c3;
          var fc = document.getElementById('feed-city');
          if (fc) fc.textContent = 'En ' + c3;
          showCitySkeleton();
          setTimeout(renderFeed, 600);
        }

        else if (action === 'bell') {
          showToast('3 notificaciones nuevas', 'success');
        }
      });

      // —— Banner promocional (snap-x; ?hidePromo=1 suprime el nodo entero) ——
      function renderPromo() {
        if (HIDE_PROMO) return;
        var rail = document.getElementById('promo-rail');
        if (!rail) return;
        rail.textContent = '';
        BANNERS.forEach(function (b) {
          var item = document.createElement('a');
          item.href = './results.html?city=' + encodeURIComponent(b.city) + '&promo=1';
          item.className = 'relative block h-[140px] w-[280px] shrink-0 snap-start overflow-hidden rounded-xl border border-[rgba(255,255,255,0.08)]';
          var img = document.createElement('img');
          img.src = b.img;
          img.alt = 'Oferta en ' + b.city;
          img.loading = 'lazy';
          img.className = 'absolute inset-0 h-full w-full object-cover';
          item.appendChild(img);
          item.appendChild(pv('div', 'pointer-events-none absolute inset-0 bg-gradient-to-t from-[#0F0F12]/95 via-[#0F0F12]/35 to-transparent', ''));
          var badge = pv('span', 'absolute left-2 top-2 rounded-md bg-[#F08A4B] px-2 py-1 text-[10px] font-bold uppercase tracking-wide text-[#0F0F12]', 'Destacado');
          item.appendChild(badge);
          var body = pv('div', 'absolute inset-x-0 bottom-0 flex items-end justify-between gap-2 p-2.5', '');
          var prices = pv('div', 'min-w-0', '');
          prices.appendChild(pv('p', 'text-[11px] leading-tight text-[#E8E8EA]/70 line-through', 'Antes ' + fmtXAF(b.o)));
          prices.appendChild(pv('p', 'text-[20px] font-bold leading-tight text-[#F2F3F5]', fmtXAF(b.p)));
          prices.appendChild(pv('p', 'text-[10px] font-medium text-[#4D9FFF]', 'Oferta · ' + b.city));
          body.appendChild(prices);
          var cta = pv('span', 'flex h-8 shrink-0 items-center rounded-lg bg-[#F08A4B] px-3 text-[13px] font-semibold text-[#0F0F12]', 'Ver');
          body.appendChild(cta);
          item.appendChild(body);
          rail.appendChild(item);
        });
      }

      // —— Selector de ciudad (bottom sheet) ——
      function renderCityList() {
        var host = document.getElementById('city-list');
        if (!host) return;
        host.textContent = '';
        CITIES.forEach(function (c4) {
          var row = document.createElement('button');
          row.type = 'button';
          row.className = 'flex h-12 w-full items-center justify-between rounded-lg px-3 text-left text-[14px] ' + (c4 === state.city ? 'text-[#4D9FFF]' : 'text-[#F2F3F5]');
          row.setAttribute('data-action', 'pick-city');
          row.setAttribute('data-city', c4);
          row.appendChild(pv('span', 'truncate', c4));
          var check = document.createElement('i');
          check.setAttribute('data-lucide', 'check');
          check.className = 'h-4 w-4 ' + (c4 === state.city ? 'text-[#4D9FFF]' : 'text-[#5A5F66]');
          row.appendChild(check);
          host.appendChild(row);
        });
        icons();
      }
      function openCitySheet() {
        var sc = document.getElementById('city-scrim');
        var sh = document.getElementById('city-sheet');
        if (!sc || !sh) return;
        renderCityList();
        sc.classList.remove('hidden');
        sh.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        icons();
      }
      function closeCitySheet() {
        var sc = document.getElementById('city-scrim');
        var sh = document.getElementById('city-sheet');
        if (!sc || !sh) return;
        sc.classList.add('hidden');
        sh.classList.add('hidden');
        document.body.style.overflow = '';
      }
      function showCitySkeleton() {
        var left = document.getElementById('col-left');
        var right = document.getElementById('col-right');
        if (!left || !right) return;
        var hs = [[220, 260, 190, 240], [200, 250, 180, 230]];
        [left, right].forEach(function (col, ci) {
          col.textContent = '';
          col.className = ci === 0 ? 'col-left min-w-0 flex-1 space-y-3' : 'col-right min-w-0 flex-1 space-y-3';
          hs[ci].forEach(function (h) {
            var s = document.createElement('div');
            s.className = 'overflow-hidden rounded-xl border border-[rgba(255,255,255,0.08)] bg-[#17171A]';
            var bar = document.createElement('div');
            bar.className = 'w-full animate-pulse border-b border-[#2A2A30] bg-[#1E1E23]';
            bar.style.height = h + 'px';
            s.appendChild(bar);
            var b = document.createElement('div');
            b.className = 'space-y-2 p-2.5';
            b.appendChild(pv('div', 'h-2.5 w-4/5 rounded bg-[#2A2A30] animate-pulse', ''));
            b.appendChild(pv('div', 'h-2.5 w-3/5 rounded border border-[#2A2A30] bg-[#1E1E23] animate-pulse', ''));
            b.appendChild(pv('div', 'h-3.5 w-1/2 rounded bg-[#2A2A30] animate-pulse', ''));
            s.appendChild(b);
            col.appendChild(s);
          });
        });
      }
      function updateFavBadge() {
        var badge = document.getElementById('fav-badge');
        if (!badge) return;
        var n = Object.keys(state.favs).filter(function (k) { return state.favs[k]; }).length;
        if (n === 0) { badge.classList.add('hidden'); badge.classList.remove('flex'); return; }
        badge.classList.remove('hidden');
        badge.classList.add('flex');
        badge.textContent = n > 9 ? '9+' : String(n);
      }

      // —— init: skeleton 1.2s → tarjetas reales in place ——
      icons();
      renderTabs();
      renderEntries();
      renderStay();
      renderPromo();
      updateFavBadge();
      var cl = document.getElementById('city-label');
      if (cl) cl.textContent = state.city;
      var fc2 = document.getElementById('feed-city');
      if (fc2) fc2.textContent = 'En ' + state.city;
      setTimeout(renderFeed, 1200);
    })();
  </script>
</body>
</html>
